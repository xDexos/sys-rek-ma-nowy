[project]
name = "sys-rek-mag-nowy"
version = "0.1.0"
description = "Profilowanie obiektów przez lokalne LLM w systemach rekomendacyjnych: Amazon Reviews 2023 (Automotive), warm i cold-start"
requires-python = ">=3.12,<3.15"
dependencies = [
    "numpy==2.5.3",
    "pandas==3.0.5",
    "scipy==1.18.1",
    "pyarrow==25.0.1",
    "pydantic==2.13.5",
    "openai==3.14.1",
    "sentence-transformers==6.0.1",
    "streamlit==1.64.0",
    "torch==2.14.0+cpu",
    "scikit-learn==1.9.1",
]

[project.scripts]
sysrekmag-download = "sys_rek_mag.download:main"
sysrekmag-prepare = "sys_rek_mag.dataset:main"
sysrekmag-llm-texts = "sys_rek_mag.llm_texts:main"
sysrekmag-encode = "sys_rek_mag.encode:main"
sysrekmag-train = "sys_rek_mag.two_tower:main"
sysrekmag-evaluate = "sys_rek_mag.evaluate:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sys_rek_mag"]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
dev = ["pytest>=9.1.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
